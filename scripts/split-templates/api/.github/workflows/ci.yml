# Deterministic checks only - no AI in the CI critical path.
# claimsdesk-api: build and test the .NET API. The web app has its own repository and pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -nologo

      - name: Test
        run: dotnet test --no-build -c Release -nologo --logger "console;verbosity=minimal"
